<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="snowflakeBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#29B5E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E88C7;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="analyticsGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#56C288;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3DA56B;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="dataOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C42;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E67332;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="agentPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B7FD6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B5FBA;stop-opacity:1" />
    </linearGradient>
    
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="3" markerHeight="3" refX="2.7" refY="0.9" orient="auto">
      <polygon points="0 0, 3 0.9, 0 1.8" fill="#29B5E8" />
    </marker>
    
    <!-- Animated arrow marker -->
    <marker id="arrowheadAnimated" markerWidth="3" markerHeight="3" refX="2.7" refY="0.9" orient="auto">
      <polygon points="0 0, 3 0.9, 0 1.8" fill="#29B5E8">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
      </polygon>
    </marker>
    
    <!-- Drop shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#F8F9FA"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2D3748">
    Snow Health Intelligence Architecture
  </text>
  
  <!-- ============ LAYER 1: AI AGENT (TOP) ============ -->
  <g id="layer1-agent">
    <rect x="200" y="70" width="400" height="80" rx="10" fill="url(#agentPurple)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite" />
    </rect>
    <text x="400" y="95" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      Snowflake Intelligence Agent
    </text>
    <text x="400" y="115" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
      Orchestration &amp; Natural Language Interface
    </text>
    <text x="400" y="135" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white" opacity="0.9">
      Routes queries | Combines insights | User interaction
    </text>
  </g>
  
  <!-- ============ LAYER 2: ANALYTICS (MIDDLE) ============ -->
  <g id="layer2-analytics">
    <!-- Left: Cortex Analyst (Structured) -->
    <rect x="50" y="200" width="220" height="120" rx="8" fill="url(#analyticsGreen)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" begin="0.5s" repeatCount="indefinite" />
    </rect>
    <text x="160" y="222" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Cortex Analyst
    </text>
    <text x="160" y="238" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white" opacity="0.95">
      Structured Analytics
    </text>
    <line x1="60" y1="245" x2="260" y2="245" stroke="white" stroke-width="1" opacity="0.3"/>
    <text x="160" y="261" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">
      • Learning Intelligence
    </text>
    <text x="160" y="276" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">
      • Revenue Intelligence
    </text>
    <text x="160" y="291" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">
      • Support Intelligence
    </text>
    <text x="160" y="308" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white" opacity="0.8">
      (3 Semantic Views)
    </text>
    
    <!-- Center: ML Models (Optional) -->
    <rect x="290" y="200" width="220" height="120" rx="8" fill="#9333EA" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5,5" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" begin="0.75s" repeatCount="indefinite" />
    </rect>
    <text x="400" y="217" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      ML Models
    </text>
    <text x="400" y="232" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white" opacity="0.95">
      (Optional)
    </text>
    <text x="400" y="247" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white" opacity="0.95">
      Predictive Analytics
    </text>
    <line x1="300" y1="254" x2="500" y2="254" stroke="white" stroke-width="1" opacity="0.3"/>
    <text x="400" y="270" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">
      • Compliance Risk
    </text>
    <text x="400" y="285" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">
      • Course Completion
    </text>
    <text x="400" y="300" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">
      • Subscription Churn
    </text>
    
    <!-- Right: Cortex Search (Unstructured) -->
    <rect x="530" y="200" width="220" height="120" rx="8" fill="url(#analyticsGreen)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" begin="1s" repeatCount="indefinite" />
    </rect>
    <text x="640" y="222" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Cortex Search
    </text>
    <text x="640" y="238" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white" opacity="0.95">
      Unstructured Search
    </text>
    <line x1="540" y1="245" x2="740" y2="245" stroke="white" stroke-width="1" opacity="0.3"/>
    <text x="640" y="261" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">
      • Support (25K docs)
    </text>
    <text x="640" y="276" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">
      • Incidents (15K docs)
    </text>
    <text x="640" y="291" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">
      • Training Materials
    </text>
    <text x="640" y="308" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white" opacity="0.8">
      (3 Search Services)
    </text>
  </g>
  
  <!-- ============ LAYER 3: DATA SOURCES (BOTTOM) ============ -->
  <g id="layer3-data">
    <!-- Left: Structured Tables -->
    <rect x="50" y="370" width="280" height="180" rx="8" fill="url(#snowflakeBlue)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" begin="1.5s" repeatCount="indefinite" />
    </rect>
    <text x="190" y="395" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="white">
      Structured Data (RAW)
    </text>
    <text x="190" y="413" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white" opacity="0.95">
      19 Tables | 2.5M+ Records
    </text>
    <line x1="60" y1="420" x2="320" y2="420" stroke="white" stroke-width="1" opacity="0.3"/>
    <text x="190" y="438" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Organizations | Employees
    </text>
    <text x="190" y="455" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Courses | Enrollments
    </text>
    <text x="190" y="472" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Credentials | Verifications
    </text>
    <text x="190" y="489" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Subscriptions | Transactions
    </text>
    <text x="190" y="506" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Support Tickets | Incidents
    </text>
    <text x="190" y="523" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Policies | Accreditations
    </text>
    
    <!-- Right: Unstructured Documents -->
    <rect x="470" y="370" width="280" height="180" rx="8" fill="url(#snowflakeBlue)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" begin="2s" repeatCount="indefinite" />
    </rect>
    <text x="610" y="395" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="white">
      Unstructured Data (RAW)
    </text>
    <text x="610" y="413" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white" opacity="0.95">
      40,000+ Documents
    </text>
    <line x1="480" y1="420" x2="740" y2="420" stroke="white" stroke-width="1" opacity="0.3"/>
    <text x="610" y="445" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      SUPPORT_TRANSCRIPTS
    </text>
    <text x="610" y="470" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      INCIDENT_REPORTS
    </text>
    <text x="610" y="495" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      TRAINING_MATERIALS
    </text>
    <text x="610" y="525" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white" opacity="0.8">
      (with CHANGE_TRACKING enabled)
    </text>
  </g>
  
  <!-- ============ ANIMATED DATA FLOW ARROWS ============ -->
  
  <!-- Structured data flow: Tables -> Cortex Analyst -->
  <g id="flow-structured">
    <path d="M 160 370 L 160 320" stroke="#56C288" stroke-width="2" fill="none" marker-end="url(#arrowheadAnimated)" opacity="0.7">
    </path>
    <circle cx="160" cy="345" r="3" fill="black">
      <animate attributeName="cy" values="370;320;370" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- Structured data flow: Tables -> ML Models -->
  <g id="flow-ml">
    <path d="M 310 370 L 370 320" stroke="#9333EA" stroke-width="2" fill="none" marker-end="url(#arrowheadAnimated)" opacity="0.6">
    </path>
    <circle cx="340" cy="345" r="2.5" fill="black">
      <animate attributeName="cy" values="370;320;370" dur="2.5s" begin="0.3s" repeatCount="indefinite" />
      <animate attributeName="cx" values="310;370;310" dur="2.5s" begin="0.3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="2.5s" begin="0.3s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- Unstructured data flow: Documents -> Cortex Search -->
  <g id="flow-unstructured">
    <path d="M 640 370 L 640 320" stroke="#29B5E8" stroke-width="2" fill="none" marker-end="url(#arrowheadAnimated)" opacity="0.7">
    </path>
    <circle cx="640" cy="345" r="3" fill="black">
      <animate attributeName="cy" values="370;320;370" dur="2s" begin="0.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.5s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- Cortex Analyst -> Intelligence Agent -->
  <g id="flow-analyst-to-agent">
    <path d="M 200 200 L 250 150" stroke="#8B7FD6" stroke-width="2" fill="none" marker-end="url(#arrowheadAnimated)" opacity="0.7">
    </path>
  </g>
  
  <!-- ML Models -> Intelligence Agent -->
  <g id="flow-ml-to-agent">
    <path d="M 400 200 L 400 150" stroke="#9333EA" stroke-width="2" fill="none" marker-end="url(#arrowheadAnimated)" opacity="0.6">
    </path>
  </g>
  
  <!-- Cortex Search -> Intelligence Agent -->
  <g id="flow-search-to-agent">
    <path d="M 580 200 L 550 150" stroke="#8B7FD6" stroke-width="2" fill="none" marker-end="url(#arrowheadAnimated)" opacity="0.7">
    </path>
  </g>
  
  <!-- Labels for data flow -->
  <g id="flow-labels">
    <!-- Above Cortex Analyst box -->
    <text x="60" y="192" font-family="Arial, sans-serif" font-size="9" fill="#3DA56B" font-weight="bold">
      Semantic Views
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" />
    </text>
    
    <!-- Above ML Models box -->
    <text x="300" y="192" font-family="Arial, sans-serif" font-size="9" fill="#9333EA" font-weight="bold">
      Training Data
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" begin="0.3s" repeatCount="indefinite" />
    </text>
    
    <!-- Above Cortex Search box -->
    <text x="540" y="192" font-family="Arial, sans-serif" font-size="9" fill="#56C288" font-weight="bold">
      Semantic Search
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="0.5s" repeatCount="indefinite" />
    </text>
    
    <!-- Above Structured Data box -->
    <text x="60" y="362" font-family="Arial, sans-serif" font-size="9" fill="#29B5E8" font-weight="bold">
      Analytics
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" begin="0.3s" repeatCount="indefinite" />
    </text>
    
    <!-- Above Unstructured Data box -->
    <text x="480" y="362" font-family="Arial, sans-serif" font-size="9" fill="#29B5E8" font-weight="bold">
      Documents
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" begin="0.8s" repeatCount="indefinite" />
    </text>
  </g>
  
  <!-- Legend -->
  <g id="legend">
    <rect x="620" y="555" width="160" height="35" rx="5" fill="white" stroke="#E2E8F0" stroke-width="1" opacity="0.9"/>
    <circle cx="635" cy="567" r="4" fill="#29B5E8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="645" y="571" font-family="Arial, sans-serif" font-size="10" fill="#2D3748">
      Data Flow
    </text>
    <text x="635" y="585" font-family="Arial, sans-serif" font-size="8" fill="#718096">
      Real-time processing
    </text>
  </g>
  
  <!-- Technology badge -->
  <g id="tech-badge">
    <rect x="20" y="555" width="180" height="35" rx="5" fill="white" stroke="#E2E8F0" stroke-width="1" opacity="0.9"/>
    <text x="110" y="571" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#29B5E8">
      Snowflake Cortex
    </text>
    <text x="110" y="585" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#718096">
      Intelligence Platform
    </text>
  </g>
  
</svg>
